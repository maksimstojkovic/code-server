services:
  opencode:
    image: ghcr.io/maksimstojkovic/code-server:latest
    container_name: opencode
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Australia/Sydney}
      - DOCKER_USER=${DOCKER_USER:-coder}
      - AUTH=${AUTH:-password}
      - PASSWORD=${PASSWORD:-}
    volumes:
      - /media/data/docker/opencode/config:/home/coder
    ports:
      - "8080:8080"
    restart: unless-stopped
