services:
  opencode:
    image: ghcr.io/maksimstojkovic/code-server:latest
    container_name: opencode
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-Australia/Sydney}
      - DEFAULT_WORKSPACE=${DEFAULT_WORKSPACE:-/home/coder/workspace}
      - DOCKER_USER=${DOCKER_USER:-coder}
    volumes:
      - /media/data/docker/opencode/config:/home/coder
    ports:
      - "8080:8080"
    # The image bakes "." as the workspace into its ENTRYPOINT, so the
    # entrypoint is re-invoked here to make the workspace env-configurable.
    entrypoint: /usr/bin/entrypoint.sh
    command: ["--bind-addr", "0.0.0.0:8080", "${DEFAULT_WORKSPACE:-/home/coder/workspace}"]
    restart: unless-stopped
