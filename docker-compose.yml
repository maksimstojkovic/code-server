services:
  opencode:
    image: ghcr.io/maksimstojkovic/code-server:latest
    container_name: opencode
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Australia/Sydney}
      - DOCKER_USER=${DOCKER_USER:-coder}
      - AUTH=${AUTH:-none}
      - PASSWORD=${PASSWORD:-}
      - DEFAULT_WORKSPACE=${DEFAULT_WORKSPACE:-/home/coder/workspace}
      - CODE_SERVER_PORT=${CODE_SERVER_PORT:-8080}
      - OPENCODE_WEB=${OPENCODE_WEB:-false}
      - OPENCODE_WEB_PORT=${OPENCODE_WEB_PORT:-4096}
      - OPENCODE_WEB_HOSTNAME=${OPENCODE_WEB_HOSTNAME:-0.0.0.0}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENCODE_MODEL=${OPENCODE_MODEL:-openrouter/z-ai/glm-5.3-flash}
      - OPENCODE_ZDR=${OPENCODE_ZDR:-true}
      - N9ROUTER_BASE_URL=${N9ROUTER_BASE_URL:-}
      - N9ROUTER_API_KEY=${N9ROUTER_API_KEY:-}
      - N9ROUTER_MODEL=${N9ROUTER_MODEL:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - TAVILY_MCP_URL=${TAVILY_MCP_URL:-https://mcp.tavily.com/mcp}
    volumes:
      - /media/data/docker/opencode/config:/home/coder
    ports:
      - "${CODE_SERVER_PORT:-8080}:${CODE_SERVER_PORT:-8080}"
      - "${OPENCODE_WEB_PORT:-4096}:${OPENCODE_WEB_PORT:-4096}"
    restart: unless-stopped
